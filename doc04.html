<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style type="text/css">
            ol li {list-style-type: lower-alpha;}
            ol {list-style-position: inside;}
            ul {list-style-position: outside;}
            li.usa {list-style-type: disc;}
            li.kor {list-style-image: url(.gif);}   /* 작은 아이콘은 gif 파일이 유리 */
            #book {width: 90%; border-spacing: 8px; text-align: center;
            transform: rotate(45deg)}
            p {background-color: aqua}
            p:hover {background-color: rgb(0, 87, 248); transition: background-color 3s}
            li {background-color: yellow}
            ul {background-color: pink}
            td {background-color: lightgreen}
        </style>
    </head>
    <body>
        <p>순서가 없는 목록</p>
        <ul>
            <li class="usa">첫 번째 항목</li>
            <li class="kor">두 번째 항목</li>
            <li>세 번째 항목</li>
        </ul>
        <p>순서가 있는 목록</p>
        <ol>
            <li>첫 번째 항목</li>
            <li>두 번째 항목</li> 
            <li>세 번째 항목</li>
        </ol>
        <table border="1" id="book">
            <tfoot>
                <td>합계</td>
                <td colspan="3">2권</td>
            </tfoot>   
            <tr>
                <th>과목</th>
                <th>책제목</th>
                <th>저자</th>
                <th>출판사</th>
            </tr>
            <tr>
                <td rowspan="2">웹프로그래밍</td>
                <td>HTML5</td>
                <td>임순범</td>
                <td>생능</td>
            </tr>
            <tr>
                <td>소셜미디어</td>
                <td>최윤철</td>
                <td>생능</td>
            </tr>     
        </table>
    </body>
</html>
